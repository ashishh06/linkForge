# Local development profile: `./mvnw spring-boot:run -Dspring-boot.run.profiles=local`
# Expects `docker compose up -d` (Postgres on 5432, Redis on 6379).
spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.linkforge: DEBUG
    org.flywaydb: INFO
    org.hibernate.SQL: DEBUG
    org.springframework.jdbc.core: DEBUG
